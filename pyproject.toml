[project]
name = "research-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "PhamVuThuNguyet",email = "nguyet.pham.researcher@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.5.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "pytest (>=8.0.0,<9.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that load full data files",
]
